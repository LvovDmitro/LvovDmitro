<svg xmlns="http://www.w3.org/2000/svg" width="360" height="230" viewBox="0 0 360 230" role="img" aria-labelledby="title desc"><title id="title">10% Depends On The Denominator</title><desc id="desc">Concept diagram, not experimental output. Fixed risk scores to Eligible cohort to Referral workload. Audit eligibility and absolute capacity separately</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0.5" y="0.5" width="359" height="229" rx="14" fill="#F4F8FF" stroke="#DBEAFE"/><rect x="20" y="20" width="4" height="14" rx="2" fill="#1D4ED8" stroke="none"/><text x="32" y="31" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="start" >10% DEPENDS ON THE DENOMINATOR</text><rect x="20" y="49" width="320" height="35" rx="9" fill="#FFFFFF" stroke="#DBEAFE"/><text x="180.0" y="72.5" font-size="18" font-weight="600" fill="#18263B" text-anchor="middle" >Same risk scores</text><path d="M180 88v11 M90 99h180 M90 99v10 M270 99v10" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="114" width="154" height="61" rx="9" fill="#FFFFFF" stroke="#DBEAFE"/><text x="97.0" y="150.5" font-size="18" font-weight="600" fill="#18263B" text-anchor="middle" >Full cohort</text><rect x="186" y="114" width="154" height="61" rx="9" fill="#FFFFFF" stroke="#DBEAFE"/><text x="263.0" y="150.5" font-size="18" font-weight="600" fill="#18263B" text-anchor="middle" >Eligible cohort</text><text x="97" y="198" font-size="17" font-weight="600" fill="#1D4ED8" text-anchor="middle" >10% of full</text><text x="263" y="198" font-size="17" font-weight="600" fill="#1D4ED8" text-anchor="middle" >10% of eligible</text><text x="20" y="218" font-size="11" font-weight="400" fill="#526078" text-anchor="start" letter-spacing="1">CONCEPT DIAGRAM</text></g></svg>
